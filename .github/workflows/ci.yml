name: CallMate AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callmate
          POSTGRES_PASSWORD: callmate123
          POSTGRES_DB: callmate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-minimum-32-characters!!
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-chars!!
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == '"'"'refs/heads/main'"'"'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build ./backend -t callmate-backend:latest
      - name: Build frontend image
        run: docker build ./frontend -t callmate-frontend:latest
